<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Cookie Share</h1>
    </header>

    <!-- State: current site not watched yet -->
    <div id="add-section" class="section hidden">
      <div class="site-name" id="current-domain"></div>
      <button id="btn-sync-site" class="btn btn-primary">Sync This Site</button>
    </div>

    <!-- State: current site is watched -->
    <div id="status-section" class="section hidden">
      <div class="site-name" id="watched-domain"></div>

      <div id="expiry-banner" class="expiry-banner hidden">
        <div class="expiry-text">
          <span class="expiry-title">Auth expiring</span>
          <span class="expiry-detail" id="expiry-detail"></span>
        </div>
        <button id="btn-refresh-now" class="btn btn-warning">Refresh now</button>
      </div>

      <div class="status-row">
        <span class="label">Last sync</span>
        <span class="value" id="last-sync">—</span>
      </div>
      <div class="status-row">
        <span class="label">Cookies</span>
        <span class="value" id="cookie-count">—</span>
      </div>
      <div class="status-row">
        <span class="label">Storage keys</span>
        <span class="value" id="storage-count">—</span>
      </div>
      <div class="status-row">
        <span class="label">Bearer tokens</span>
        <span class="value" id="bearer-count">—</span>
      </div>
      <div id="error-row" class="status-row" style="display:none">
        <span class="label">Error</span>
        <span class="value error" id="sync-error"></span>
      </div>
      <div class="btn-row">
        <button id="btn-sync-now" class="btn btn-secondary">Sync Now</button>
        <button id="btn-remove" class="btn btn-danger">Remove</button>
      </div>
    </div>

    <!-- State: no usable site (chrome://, new tab, etc.) -->
    <div id="no-site-section" class="section hidden">
      <p class="muted">Navigate to a site to sync its session.</p>
    </div>

    <footer>
      <span class="footer-stats"><span id="domain-count">0</span> sites watched</span>
      <a href="#" id="link-options">Options</a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
