<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cookie Share — Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Cookie Share</h1>
      <p class="subtitle">Manage synced domains and settings</p>
    </header>

    <!-- Auth status -->
    <div id="auth-banner" class="banner hidden">
      <span>Not authenticated with Google Cloud.</span>
      <button id="btn-auth" class="btn btn-small">Sign In</button>
    </div>

    <!-- Domains table -->
    <section>
      <div class="section-header">
        <h2>Watched Domains</h2>
        <button id="btn-sync-all" class="btn btn-small">Sync All</button>
      </div>

      <table id="domains-table">
        <thead>
          <tr>
            <th>Domain</th>
            <th>Cookies</th>
            <th>Storage Keys</th>
            <th>Last Sync</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="domains-body">
          <!-- Populated by JS -->
        </tbody>
      </table>

      <div id="empty-state" class="empty hidden">
        No domains being watched. Visit a website and click the extension icon to add one.
      </div>
    </section>

    <!-- Add domain manually -->
    <section>
      <h2>Add Domain</h2>
      <div class="input-row">
        <input type="text" id="input-domain" placeholder="e.g. superhuman.com">
        <button id="btn-add" class="btn btn-primary">Add</button>
      </div>
    </section>

    <!-- Settings -->
    <section>
      <h2>Settings</h2>
      <div class="setting-row">
        <label for="input-project">GCP Project ID</label>
        <input type="text" id="input-project" placeholder="my-gcp-project-id">
      </div>
      <div class="setting-row">
        <label for="input-interval">Sync interval (minutes)</label>
        <input type="number" id="input-interval" min="5" max="60" value="15">
      </div>
      <button id="btn-save-settings" class="btn btn-secondary">Save Settings</button>
    </section>
  </div>
  <script src="options.js"></script>
</body>
</html>
